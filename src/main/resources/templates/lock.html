<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Locked Workspace — DropBin</title>
    <link rel="stylesheet" th:href="@{/style.css(v='3.0')}" href="/style.css?v=3.0"/>
    <link rel="stylesheet" th:href="@{/css/style.css(v='3.0')}" href="/css/style.css?v=3.0"/>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; background: var(--bg);">

<header class="site-header index-header">
    <div class="header-left">
        <a href="/" class="logo">
            <span>📦 DropBin</span>
            <span class="logo-badge" style="background:#f59e0b; color:#fff;">Locked</span>
        </a>
    </div>

    <div class="header-right">
        <a href="/d/new" class="btn btn-primary">
            <svg class="btn-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>New Bin</span>
        </a>
    </div>
</header>

<main style="flex:1; display:flex; align-items:center; justify-content:center; padding:2rem 1rem;">
    <div class="create-card" style="max-width: 440px; width: 100%; text-align: center; box-shadow: var(--shadow-lg); padding: 2.5rem 2rem;">
        
        <!-- Animated Lock Icon Badge -->
        <div style="width: 64px; height: 64px; margin: 0 auto 1.25rem; border-radius: 50%; background: #fef3c7; color: #d97706; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 8px rgba(245, 158, 11, 0.1);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>

        <h3 style="margin: 0 0 0.5rem; font-size: 1.35rem; color: var(--text); font-weight: 700;">Workspace Locked</h3>
        <p style="margin: 0 0 1.25rem; font-size: 0.88rem; color: var(--text-muted); line-height: 1.5;">
            This workspace is password-protected. Enter the password to access notes and shared files.
        </p>

        <!-- Workspace Path Chip -->
        <div style="display: inline-flex; align-items: center; gap: 0.35rem; background: var(--bg); border: 1px solid var(--border); border-radius: 9999px; padding: 0.3rem 0.85rem; margin-bottom: 1.5rem; font-family: var(--mono); font-size: 0.82rem; color: var(--text);">
            <span style="color: var(--text-muted);">/d/</span><strong th:text="${activeId}">pad</strong>
            <span th:if="${isReadOnly}" style="font-size:0.72rem; color:#d97706; font-weight:700;">[Read-Only]</span>
        </div>

        <!-- Error banner (hidden initially) -->
        <div id="unlockError" style="display: none; background: #fee2e2; border: 1px solid #fca5a5; color: #b91c1c; border-radius: var(--radius-sm); padding: 0.65rem 0.85rem; font-size: 0.84rem; margin-bottom: 1.25rem; text-align: left;">
            <span id="unlockErrorText">Incorrect password</span>
        </div>

        <form id="unlockForm" onsubmit="handleUnlock(event)">
            <div style="position: relative; margin-bottom: 1.25rem;">
                <input type="password" id="passwordInput" class="url-text-input"
                       placeholder="Enter workspace password"
                       required autofocus
                       style="width: 100%; padding-right: 2.75rem; border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 0.95rem; height: 44px;"/>
                <button type="button" onclick="togglePasswordVisibility()" title="Toggle visibility"
                        style="position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 0.25rem; display: flex; align-items: center;">
                    <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>

            <button type="submit" id="btnUnlock" class="btn btn-primary" style="width: 100%; height: 44px; justify-content: center; font-size: 0.95rem; font-weight: 600;">
                <svg class="btn-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
                <span>Unlock Workspace</span>
            </button>
        </form>

        <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-light); font-size: 0.78rem; color: var(--text-muted); display: flex; align-items: center; justify-content: center; gap: 0.4rem;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span>Rate-limited brute force protection & 5-min inactivity expiry</span>
        </div>
    </div>
</main>

<script th:inline="javascript">
    /*<![CDATA[*/
    const pasteId = /*[[${pasteId}]]*/ 'pad';
    /*]]>*/

    function togglePasswordVisibility() {
        const input = document.getElementById('passwordInput');
        const eye = document.getElementById('eyeIcon');
        if (!input) return;
        if (input.type === 'password') {
            input.type = 'text';
            eye.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
        } else {
            input.type = 'password';
            eye.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        }
    }

    async function handleUnlock(event) {
        event.preventDefault();
        const input = document.getElementById('passwordInput');
        const btn = document.getElementById('btnUnlock');
        const errorBox = document.getElementById('unlockError');
        const errorText = document.getElementById('unlockErrorText');
        const password = input.value;

        if (!password) return;

        btn.disabled = true;
        btn.innerHTML = '<svg class="btn-icon btn-spin" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg> <span>Unlocking...</span>';
        if (errorBox) errorBox.style.display = 'none';

        try {
            const resp = await fetch(`/api/d/${encodeURIComponent(pasteId)}/unlock`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ password: password })
            });

            const data = await resp.json().catch(() => ({}));

            if (resp.ok && data.success) {
                // If token returned, optionally save in sessionStorage for API headers
                if (data.token) {
                    sessionStorage.setItem('bin_token_' + pasteId, data.token);
                }
                // Reload page to enter workspace
                window.location.reload();
            } else {
                btn.disabled = false;
                btn.innerHTML = '<svg class="btn-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg> <span>Unlock Workspace</span>';
                if (errorBox && errorText) {
                    errorText.textContent = data.error || (resp.status === 429 ? 'Too many attempts. Please wait 1 minute.' : 'Incorrect password.');
                    errorBox.style.display = 'block';
                }
                input.focus();
                input.select();
            }
        } catch (err) {
            btn.disabled = false;
            btn.innerHTML = '<svg class="btn-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg> <span>Unlock Workspace</span>';
            if (errorBox && errorText) {
                errorText.textContent = 'Could not connect to server. Please try again.';
                errorBox.style.display = 'block';
            }
        }
    }
</script>
</body>
</html>
