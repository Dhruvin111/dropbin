<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Not Found — TextBin</title>
    <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>
<header class="site-header">
    <a href="/" class="logo">📋 TextBin</a>
</header>
<main class="container center-page">
    <div class="error-box">
        <div class="error-icon">🕳️</div>
        <h1>Paste Not Found</h1>
        <p th:text="${message != null ? message : 'This paste has expired or never existed.'}">
            This paste has expired or never existed.
        </p>
        <a href="/" class="btn-submit">Create a New Paste</a>
    </div>
</main>
</body>
</html>
