# ─── Server ────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.address=0.0.0.0

# Respect reverse proxy headers (Railway, Cloudflare, Nginx, Render) for HTTPS & Host detection
server.forward-headers-strategy=framework

# ─── Base URL / Domain (Optional, defaults to incoming request host) ────────
app.base-url=${APP_BASE_URL:}

# ─── File Uploads (up to 10MB) ──────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.upload.dir=${APP_UPLOAD_DIR:./uploads}

# ─── PostgreSQL ─────────────────────────────────────────────────────────────
# Automatically binds to Railway's Postgres environment variables or local Docker compose
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:textbin}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:textbin_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:changeme}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP tuned for production cloud containers)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=20000

# ─── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ─── Thymeleaf ──────────────────────────────────────────────────────────────
# Enabled in production for fast caching; set SPRING_THYMELEAF_CACHE=false in dev
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:true}

# ─── Logging ────────────────────────────────────────────────────────────────
logging.level.com.textbin=INFO
logging.level.org.springframework.scheduling=INFO
