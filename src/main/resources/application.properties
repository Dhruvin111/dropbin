# ─── Server ────────────────────────────────────────────────────────────────
server.port=8080
server.address=0.0.0.0

# ─── Multipart File Upload (up to 10MB) ──────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ─── PostgreSQL ─────────────────────────────────────────────────────────────
# Replace with your actual DB credentials / host
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP defaults are fine; tune for prod)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ─── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
# On first run this creates the table. Switch to 'validate' after deploy.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ─── Thymeleaf ──────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false
# Set to true in production for performance

# ─── Logging ────────────────────────────────────────────────────────────────
logging.level.com.textbin=INFO
logging.level.org.springframework.scheduling=INFO
